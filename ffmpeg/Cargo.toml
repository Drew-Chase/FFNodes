[package]
name = "ffmpeg"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["process", "fs", "macros"] }
anyhow = "1.0.100"
thiserror = "2.0"
reqwest = { version = "0.12", features = ["json"] }
zip = "2.2"
tokio-interactive = {version = "0.2.0"}
encoding_rs = "0.8"