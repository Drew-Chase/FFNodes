[package]
name = "package"
version = "0.1.0"
edition = "2024"

[dependencies]
log = { version = "0.4.29" }
pretty_env_logger = { version = "0.5.0" }
zip = { version = "6.0.0", features = ["lzma-static"] }
clap = { version = "4.5.53", features = ["derive", "wrap_help", "unicode", "color", "string", "help", "error-context", "suggestions", "usage"] }
anyhow = {version = "1.0.100"}
which = {version = "8.0.0"}
tokio = {version = "1.48.0", features = ["rt-multi-thread", "rt","macros"]}
regex = "1.12.2"
semver = "1.0.27"